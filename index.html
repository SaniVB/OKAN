<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OKAN | Desenvolvimento Humano Integral</title>

  <style>
    :root {
      --verde: #073f3b;
      --verde-escuro: #052f2c;
      --dourado: #c8a565;
      --dourado-claro: #e1ca92;
      --creme: #f8f4e9;
      --branco: #fffdf7;
      --texto: #173f3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: var(--creme);
      line-height: 1.6;
    }

    /* MENU */

    header {
      background: rgba(255,253,247,0.96);
      border-bottom: 1px solid rgba(200,165,101,0.35);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav {
      max-width: 1400px;
      margin: auto;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      letter-spacing: 6px;
      color: var(--verde);
      font-weight: normal;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 27px;
      flex-wrap: wrap;
    }

    .menu a {
      color: var(--verde);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .menu a:hover {
      color: var(--dourado);
    }

    .btn-consulta {
      background: var(--verde);
      color: white !important;
      padding: 12px 22px;
      border-radius: 30px;
    }
